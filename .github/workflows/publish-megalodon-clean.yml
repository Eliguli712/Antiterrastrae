name: Publish clean megalodon gallery
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-clean-megalodon
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify assets and publish gallery
        run: |
          python -m pip install numpy
          python .github/scripts/publish-megalodon-clean.py
