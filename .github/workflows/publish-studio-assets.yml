name: Publish complete tooth and workflow poster assets
on:
  push:
    branches: [main]
    paths: [.github/studio-transfer.json, .github/import-studio-assets.py, .github/workflows/publish-studio-assets.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            design/megalodon
      - name: Transfer verified poster and full-resolution render assets
        run: python .github/import-studio-assets.py
      - name: Commit the verified assets
        run: |
          git add --sparse -- design/megalodon/assets
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Add full 31M studio renders and all original workflow posters"
            git push origin HEAD:main
          fi
          git rev-parse HEAD
