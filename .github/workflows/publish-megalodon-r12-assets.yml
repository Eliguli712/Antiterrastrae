name: Publish refined megalodon support assets R12
on:
  push:
    branches: [main]
    paths:
      - '.github/megalodon-r12-assets.json'
      - '.github/scripts/publish-megalodon-r12-assets.py'
      - '.github/workflows/publish-megalodon-r12-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: megalodon-r12-assets
  cancel-in-progress: false
jobs:
  publish-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify and preserve source-correct assets
        run: python .github/scripts/publish-megalodon-r12-assets.py
