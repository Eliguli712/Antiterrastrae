name: Publish audited native stress viewer data
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-native-stress-viewer.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  viewer-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: design/native-stress
      - name: Recover the already audited release and matching viewer fields
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}/native-viewer-output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          gh release download megalodon-native-stress-r3 --repo "$GITHUB_REPOSITORY" --dir "$OUT" --pattern native-stress-audit.json --pattern native-stress-provenance.json --pattern release-manifest.json --pattern High_Stress_Design_EN_DE_EL.pdf --pattern High_Stress_Design_Preview.png
          python - <<'PY'
          import hashlib,json,os,urllib.request
          from pathlib import Path
          out=Path(os.environ['OUT']);audit=json.loads((out/'native-stress-audit.json').read_text());manifest=json.loads((out/'release-manifest.json').read_text())
          assert audit['all_vertices_literal_identical'] and audit['all_triangle_indices_and_order_identical'] and audit['zip_crc_passed']
          assert audit['vertices_checked']==37951699 and audit['triangles_checked']==74293846
          for name in ['tooth-von-mises.bin','tooth-soft-von-mises.bin']:
              req=urllib.request.Request('https://megalodon-native-stress-eliguli.eliguli712.chatgpt.site/assets/'+name,headers={'User-Agent':'Vrontiki-native-stress/3'})
              data=urllib.request.urlopen(req,timeout=60).read()
              assert hashlib.sha256(data).hexdigest()==manifest[name]['sha256'],name
              (out/name).write_bytes(data)
          for name in ['High_Stress_Design_EN_DE_EL.pdf','High_Stress_Design_Preview.png']:
              assert hashlib.sha256((out/name).read_bytes()).hexdigest()==manifest[name]['sha256'],name
          print('Full geometry audit and every transferred viewer hash verified.')
          PY
          gh release upload megalodon-native-stress-r3 --repo "$GITHUB_REPOSITORY" --clobber "$OUT/tooth-von-mises.bin" "$OUT/tooth-soft-von-mises.bin"
      - name: Publish dedicated data branch
        env:
          OUT: ${{ runner.temp }}/native-viewer-output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan native-stress-r3-data
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p assets
          cp "$OUT/"* assets/
          git add --sparse assets
          git commit -m "Publish audited native CT stress viewer data"
          git push origin HEAD:refs/heads/native-stress-r3-data --force
