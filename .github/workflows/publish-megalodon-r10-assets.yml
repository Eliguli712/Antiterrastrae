name: Publish megalodon manufacturing and poster assets R10
on:
  push:
    branches: [main]
    paths:
      - '.github/megalodon-r10-assets.json'
      - '.github/scripts/publish-megalodon-r10-assets.py'
      - '.github/workflows/publish-megalodon-r10-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: megalodon-r10-assets
  cancel-in-progress: false
jobs:
  publish-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify and preserve R10 assets
        run: python .github/scripts/publish-megalodon-r10-assets.py
