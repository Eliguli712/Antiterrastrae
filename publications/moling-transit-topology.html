function paint(){g.setTransform(dpr,0,0,dpr,0,0);g.fillStyle='#f7f8ed';g.fillRect(0,0,W,H);g.lineCap='round';g.lineJoin='round';hits=[];for(let li=0;li<net.lines.length;li++){const l=net.lines[li],seq=l.st.concat(l.ring?l.st.slice(0,1):[]);if(seq.length<2)continue;g.beginPath();seq.forEach((id,i)=>{const p=pos(net.nodes[id]);i?g.lineTo(...p):g.moveTo(...p)});g.strokeStyle=l.col;g.globalAlpha=focus<0||focus===li?.86:.09;g.lineWidth=focus===li?4.2:2.2;g.setLineDash(l.mode==='metro'?[]:[7,4]);g.stroke();for(let j=1;j<seq.length;j++)hits.push({a:pos(net.nodes[seq[j-1]]),b:pos(net.nodes[seq[j]]),li})}g.setLineDash([]);g.globalAlpha=1;const visible=new Set(focus<0?net.nodes.map((_,i)=>i):net.lines[focus].st),labels=[];for(const i of visible){const n=net.nodes[i],p=pos(n),transfer=net.members[i].length>1,term=net.termini[i].length;if(p[0]<-10||p[0]>W+10||p[1]<-10||p[1]>H+10)continue;const r=i===station?7:transfer?4:2.7;g.beginPath();g.arc(...p,r,0,7);g.fillStyle=i===station?'#f2c86e':'#fffdf3';g.fill();g.strokeStyle='#234b40';g.lineWidth=transfer?1.5:1;g.stroke();if(focus>=0||i===station||cam.s>15&&(transfer||term)){const cell=Math.floor(p[0]/65)+','+Math.floor(p[1]/15);if(!labels.includes(cell)||i===station){labels.push(cell);g.font=(i===station?'700 ':'')+'11px system-ui';g.fillStyle='#21483e';g.fillText(n[0],p[0]+6,p[1]-5)}}}g.fillStyle='#496d5d';g.font='12px system-ui';g.fillText(net.name+' · '+net.nodes.length+' 节点 · '+net.transfer_stations+' 换乘站',15,23)}
function stationInfo(i){station=i;const n=net.nodes[i],ls=net.members[i];$('info').innerHTML='<h3>'+esc(n[0])+'</h3><small>'+esc(net.city+':N'+i)+' · '+(ls.length>1?'换乘站':'普通站')+'</small><p>⇄ '+ls.map(j=>esc(net.lines[j].n)).join('、')+'</p>'+ls.map((j,k)=>{const l=net.lines[j],seq=l.st,start=seq[0]===i,end=seq[seq.length-1]===i;return '<button data-line="'+j+'">'+esc(l.n)+(l.ring?' · 环线':start?' · 始发站':end?' · 终点站':'')+'<small>'+((k*2)+1)+'／'+((k*2)+2)+' 站台 → '+esc(l.ring?'内环／外环':net.nodes[seq[0]][0]+'／'+net.nodes[seq[seq.length-1]][0])+'</small></button>'}).join('')+'<p>↥ A口：北侧街坊 · ↥ B口：南侧街坊'+(ls.length>1?' · C／D口：换乘与公交接驳':'')+'</p><p class="note">出入口与站台为场景规划模板；精确口位与湖海避让在城市地理视图显示。站间交叉不会自动认定为换乘。</p>';paint()}
function lineInfo(i){focus=i;station=-1;const l=net.lines[i];$('info').innerHTML='<h3 style="border-left:5px solid '+esc(l.col)+';padding-left:10px">'+esc(l.n)+'</h3><p>'+esc(l.status)+' · '+l.km+' km · '+l.st.length+' 站'+(l.ring?' · 环线':'')+'</p>'+l.st.map((n,k)=>'<button data-stop="'+n+'">'+(k===0?'始 ':k===l.st.length-1&&!l.ring?'终 ':'')+esc(net.nodes[n][0])+(net.members[n].length>1?'<small>⇄ '+net.members[n].filter(x=>x!==i).map(x=>esc(net.lines[x].n)).join('、')+'</small>':'')+'</button>').join('');paint()}
function list(){const q=$('search').value.toLowerCase();$('lines').innerHTML=net.lines.map((l,i)=>({l,i})).filter(({l})=>!q||[l.n,...l.st.map(j=>net.nodes[j][0])].join(' ').toLowerCase().includes(q)).map(({l,i})=>'<button data-line="'+i+'"><i style="background:'+esc(l.col)+'"></i><span>'+esc(l.n)+'<small>'+l.st.length+' 站 · '+(l.mode==='metro'?'地铁':l.mode==='light'?'轻轨／电车':'快速通行')+'</small></span></button>').join('');$('summary').textContent=net.nodes.length+' 站 · '+net.lines.length+' 线 · '+net.transfer_stations+' 个换乘站'}
document.addEventListener('click',e=>{const l=e.target.closest('[data-line]'),s=e.target.closest('[data-stop]');if(l)lineInfo(+l.dataset.line);if(s)stationInfo(+s.dataset.stop)});$('search').oninput=list;$('city').onchange=()=>{net=all.find(n=>n.city===$('city').value);focus=station=-1;$('info').textContent='点击线路或站点查看详情。';list();fit()};$('reset').onclick=()=>{focus=station=-1;fit()};function resize(){const r=cv.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(2,devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;fit()}new ResizeObserver(resize).observe(cv);
function local(e){const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
cv.onpointerdown=e=>{const p=local(e);pointers.set(e.pointerId,p);cv.setPointerCapture(e.pointerId);moved=false;if(pointers.size===1)drag={x:p[0],y:p[1],cx:cam.x,cy:cam.y};else if(pointers.size===2){const [a,b]=[...pointers.values()],m=[(a[0]+b[0])/2,(a[1]+b[1])/2];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),s:cam.s,x:cam.x+(m[0]-W/2)/cam.s,y:cam.y+(m[1]-H/2)/cam.s};drag=null;moved=true}};
cv.onpointermove=e=>{if(!pointers.has(e.pointerId))return;const p=local(e);pointers.set(e.pointerId,p);if(pointers.size>=2&&pinch){const [a,b]=[...pointers.values()],m=[(a[0]+b[0])/2,(a[1]+b[1])/2];cam.s=Math.max(.3,Math.min(1200,pinch.s*Math.hypot(a[0]-b[0],a[1]-b[1])/(pinch.d||1)));cam.x=pinch.x-(m[0]-W/2)/cam.s;cam.y=pinch.y-(m[1]-H/2)/cam.s;moved=true;paint();return}if(!drag)return;const dx=p[0]-drag.x,dy=p[1]-drag.y;if(Math.hypot(dx,dy)>4)moved=true;cam.x=drag.cx-dx/cam.s;cam.y=drag.cy-dy/cam.s;paint()};
cv.onpointerup=e=>{pointers.delete(e.pointerId);drag=null;if(pinch){pinch=null;moved=true;return}if(moved)return;const p=local(e);let nearest=-1,best=11;net.nodes.forEach((n,i)=>{const a=pos(n),d=Math.hypot(a[0]-p[0],a[1]-p[1]);if(d<best){best=d;nearest=i}});if(nearest>=0){stationInfo(nearest);return}let hit=-1;best=9;for(const h of hits){const dx=h.b[0]-h.a[0],dy=h.b[1]-h.a[1],t=Math.max(0,Math.min(1,((p[0]-h.a[0])*dx+(p[1]-h.a[1])*dy)/(dx*dx+dy*dy||1))),d=Math.hypot(p[0]-h.a[0]-t*dx,p[1]-h.a[1]-t*dy);if(d<best){best=d;hit=h.li}}if(hit>=0)lineInfo(hit)};cv.onpointercancel=e=>{pointers.delete(e.pointerId);drag=pinch=null};cv.onwheel=e=>{e.preventDefault();const p=local(e),x=p[0]-W/2,y=p[1]-H/2,ns=Math.max(.3,Math.min(1200,cam.s*Math.exp(-e.deltaY*.0015)));cam.x+=x/cam.s-x/ns;cam.y+=y/cam.s-y/ns;cam.s=ns;paint()};
$('download').onclick=()=>{if(!net.nodes.length)return;const pts=net.nodes.map(n=>[n[1],n[2]]),xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),x0=Math.min(...xs),y0=Math.min(...ys),x1=Math.max(...xs),y1=Math.max(...ys),w=1800,h=1300,s=Math.min((w-100)/Math.max(1,x1-x0),(h-140)/Math.max(1,y1-y0)),p=i=>[(pts[i][0]-x0)*s+50,(pts[i][1]-y0)*s+90];let str='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+w+' '+h+'"><rect width="100%" height="100%" fill="#f7f8ed"/><text x="40" y="45" font-family="system-ui" font-size="26">'+esc(net.name)+' · 轨道等效拓扑</text>';for(const l of net.lines){const q=l.st.concat(l.ring?l.st.slice(0,1):[]);str+='<polyline data-stop-sequence="'+q.join(',')+'" points="'+q.map(i=>p(i).join(',')).join(' ')+'" fill="none" stroke="'+esc(l.col)+'" stroke-width="2.5"><title>'+esc(l.n)+'</title></polyline>'}net.nodes.forEach((n,i)=>{const q=p(i);str+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="'+(net.members[i].length>1?3:2)+'" fill="white" stroke="#345c4b"><title>'+esc(n[0])+'</title></circle>'});str+='</svg>';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([str],{type:'image/svg+xml'}));a.download=net.city+'-transit-v27.svg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};list();const hash=decodeURIComponent(location.hash.slice(1));if(all.some(n=>n.city===hash)){$('city').value=hash;$('city').onchange()}resize();window.__topology27={getNetwork:()=>net,selectLine:lineInfo,selectStation:stationInfo};})();
